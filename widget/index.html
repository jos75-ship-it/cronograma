<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Hoje &amp; Amanhã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F12;
    --card:#12171C;
    --card-2:#161C22;
    --line:#232B32;
    --ink:#E7ECEF;
    --ink-soft:#8A97A3;
    --ink-faint:#5B6670;
    --fixed:#7C9CDB;
    --fixed-tint:rgba(124,156,219,0.10);
    --estagio:#3ECF8E;
    --estagio-tint:rgba(62,207,142,0.10);
    --sat:#C792EA;
    --sat-tint:rgba(199,146,234,0.10);
    --gc:#D8985A;
    --gc1:#5FB8CE;
    --gc12:#E0B84F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    padding:18px;
    min-height:100vh;
  }
  .wrap{max-width:720px; margin:0 auto;}

  header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; gap:10px; flex-wrap:wrap;
  }
  .brand{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--estagio); font-weight:600;
  }
  .clock{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint);
  }

  .cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:460px){
    .cols{grid-template-columns:1fr;}
  }

  .day-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:120px;
  }
  .day-card.today{ border-color:rgba(62,207,142,0.35); }

  .day-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    padding-bottom:9px; border-bottom:1px dashed var(--line);
  }
  .day-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  .day-card.today .day-label{ color:var(--estagio); }
  .day-title{
    font-family:'Source Serif 4', serif; font-weight:700; font-size:18px; line-height:1.1;
  }
  .day-date{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);
  }

  .blocks{ display:flex; flex-direction:column; gap:8px; }

  .block{
    border-left:3px solid var(--fixed);
    background:var(--fixed-tint);
    border-radius:0 8px 8px 0;
    padding:7px 10px;
  }
  .block.estagio{ border-left-color:var(--estagio); background:var(--estagio-tint); }
  .block.fixo{ border-left-color:var(--fixed); background:var(--fixed-tint); }
  .block.sat{ border-left-color:var(--sat); background:var(--sat-tint); }

  .block-time{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:1px;
  }
  .block-title{ font-size:13px; font-weight:600; line-height:1.3; color:var(--ink); }
  .block-loc{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .block-tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:9px;
    letter-spacing:0.05em; text-transform:uppercase; margin-top:5px; font-weight:600;
    padding:1.5px 6px; border-radius:4px; color:#0B0F12;
  }
  .block-tag.g-c{ background:var(--gc); }
  .block-tag.g-c1{ background:var(--gc1); }
  .block-tag.g-c12{ background:var(--gc12); }
  .block-tag.sat{ background:var(--sat); }
  .block.fixo .block-tag{ background:var(--fixed); }

  .empty{
    font-size:12.5px; color:var(--ink-faint); font-style:italic; padding:6px 2px;
  }

  footer{
    margin-top:14px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-faint);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">7º Período · Cronograma</span>
    <span class="clock" id="clock"></span>
  </header>

  <div class="cols" id="cols"></div>

  <footer>atualiza sozinho todo dia à meia-noite</footer>
</div>

<script>

, "start": "16:00", "end": "18:00", "title": "Oftalmologia", "loc": "CONSULTÓRIO", "prof": "Rodrigo", "grupo": "C", "type": "estagio"}, {"date": "2026-08-25", "start": "07:00", "end": "12:00", "title": "Neurologia", "loc": "HRLN", "prof": "Gustavo", "grupo": "C1", "type": "estagio"}, {"date": "2026-08-26", "start": "10:00", "end": "13:00", "title": "Urologia", "loc": "STELLA MARIS", "prof": "Eder", "grupo": "C1", "type": "estagio"}, {"date": "2026-08-27", "start": "08:00", "end": "12:00", "title": "Clínica Médica III", "loc": "HRLN", "prof": "Gisele", "grupo": "C1", "type": "estagio"}, {"date": "2026-08-27", "start": "15:00", "end": "19:30", "title": "Ginecologia I", "loc": "LAB SIMULAÇÃO", "prof": "Flávio", "grupo": "C", "type": "estagio"}, {"date": "2026-08-28", "start": "16:30", "end": "18:30", "title": "Pediatria I", "loc": "LAB SIMULAÇÃO", "prof": "Joselita", "grupo": "C", "type": "estagio"}, {"date": "2026-08-31", "start": "10:00", "end": "12:30", "title": "Clínica Cirúrgica III (Téc. Cirúrgica)", "loc": "LAB. TEC. CIRURGIA", "prof": "Douglas, Vinicius e Giselle", "grupo": "C", "type": "fixo"}, {"date": "2026-09-01", "start": "08:00", "end": "10:00", "title": "Oftalmologia", "loc": "HOC", "prof": "Camila", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-03", "start": "07:00", "end": "09:30", "title": "Otorrinolaringologia", "loc": "STELLA MARIS", "prof": "Pedro e Carolina", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-03", "start": "17:00", "end": "19:00", "title": "Pediatria I", "loc": "HRLN", "prof": "Michele", "grupo": "C1.2", "type": "estagio"}, {"date": "2026-09-04", "start": "17:00", "end": "19:00", "title": "Urologia", "loc": "LAB SIMULAÇÃO", "prof": "Eder, Maciel, Paulo e Mateus", "grupo": "C", "type": "estagio"}, {"date": "2026-09-08", "start": "07:00", "end": "09:30", "title": "Otorrinolaringologia", "loc": "STELLA MARIS", "prof": "Pedro e Carolina", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-10", "start": "08:00", "end": "12:00", "title": "Clínica Médica III", "loc": "MEDVIDA", "prof": "Fernanda", "grupo": "C", "type": "estagio"}, {"date": "2026-09-11", "start": "15:00", "end": "17:00", "title": "Urologia", "loc": "LAB SIMULAÇÃO", "prof": "Eder, Maciel, Paulo e Mateus", "grupo": "C", "type": "estagio"}, {"date": "2026-09-15", "start": "07:00", "end": "12:00", "title": "Clínica Cirúrgica III", "loc": "HRLN", "prof": "Douglas, Vinicius, Rosyane e Giselle", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-18", "start": "08:00", "end": "10:30", "title": "Ginecologia I", "loc": "LAB SIMULAÇÃO", "prof": "Chacon", "grupo": "C", "type": "estagio"}, {"date": "2026-09-18", "start": "16:00", "end": "18:00", "title": "Oftalmologia", "loc": "CONSULTÓRIO", "prof": "Rodrigo", "grupo": "C", "type": "estagio"}, {"date": "2026-09-21", "start": "10:00", "end": "12:30", "title": "Clínica Cirúrgica III (Téc. Cirúrgica)", "loc": "LAB. TEC. CIRURGIA", "prof": "Douglas, Vinicius e Giselle", "grupo": "C", "type": "fixo"}, {"date": "2026-09-22", "start": "08:00", "end": "12:00", "title": "Clínica Médica III", "loc": "HRLN", "prof": "Antonio", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-22", "start": "16:00", "end": "19:30", "title": "Neurologia", "loc": "HRLN", "prof": "Arthus", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-24", "start": "08:00", "end": "12:00", "title": "Urologia", "loc": "CEMCEO", "prof": "Paulo Sérgio", "grupo": "C1", "type": "estagio"}, {"date": "2026-09-24", "start": "15:00", "end": "19:30", "title": "Ginecologia I", "loc": "LAB SIMULAÇÃO", "prof": "Flávio", "grupo": "C", "type": "estagio"}, {"date": "2026-09-25", "start": "16:30", "end": "18:30", "title": "Pediatria I", "loc": "LAB SIMULAÇÃO", "prof": "Joselita", "grupo": "C", "type": "estagio"}, {"date": "2026-10-01", "start": "07:00", "end": "09:30", "title": "Otorrinolaringologia", "loc": "STELLA MARIS", "prof": "Pedro e Carolina", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-02", "start": "17:00", "end": "19:00", "title": "Urologia", "loc": "LAB SIMULAÇÃO", "prof": "Eder, Maciel, Paulo e Mateus", "grupo": "C", "type": "estagio"}, {"date": "2026-10-05", "start": "10:00", "end": "12:30", "title": "Clínica Cirúrgica III (Téc. Cirúrgica)", "loc": "LAB. TEC. CIRURGIA", "prof": "Douglas, Vinicius e Giselle", "grupo": "C", "type": "fixo"}, {"date": "2026-10-06", "start": "07:00", "end": "09:30", "title": "Otorrinolaringologia", "loc": "STELLA MARIS", "prof": "Pedro e Carolina", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-08", "start": "08:00", "end": "12:00", "title": "Clínica Médica III", "loc": "MEDVIDA", "prof": "Fernanda", "grupo": "C", "type": "estagio"}, {"date": "2026-10-08", "start": "15:00", "end": "19:00", "title": "Pediatria I", "loc": "CONSULTÓRIO", "prof": "Elisa", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-09", "start": "15:00", "end": "17:00", "title": "Urologia", "loc": "LAB SIMULAÇÃO", "prof": "Eder, Maciel, Paulo e Mateus", "grupo": "C", "type": "estagio"}, {"date": "2026-10-15", "start": "08:00", "end": "12:00", "title": "Pediatria I", "loc": "UBS GOLFINHOS", "prof": "Erik", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-16", "start": "08:00", "end": "10:30", "title": "Ginecologia I", "loc": "LAB SIMULAÇÃO", "prof": "Chacon", "grupo": "C", "type": "estagio"}, {"date": "2026-10-16", "start": "16:00", "end": "18:00", "title": "Oftalmologia", "loc": "CONSULTÓRIO", "prof": "Rodrigo", "grupo": "C", "type": "estagio"}, {"date": "2026-10-20", "start": "07:00", "end": "12:00", "title": "Clínica Cirúrgica III", "loc": "HRLN", "prof": "Douglas, Vinicius, Rosyane e Giselle", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-22", "start": "08:00", "end": "12:00", "title": "Clínica Médica III", "loc": "HRLN", "prof": "Gisele", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-22", "start": "15:00", "end": "19:30", "title": "Ginecologia I", "loc": "LAB SIMULAÇÃO", "prof": "Flávio", "grupo": "C", "type": "estagio"}, {"date": "2026-10-23", "start": "16:30", "end": "18:30", "title": "Pediatria I", "loc": "LAB SIMULAÇÃO", "prof": "Joselita", "grupo": "C", "type": "estagio"}, {"date": "2026-10-27", "start": "07:00", "end": "12:00", "title": "Neurologia", "loc": "HRLN", "prof": "Gustavo", "grupo": "C1", "type": "estagio"}, {"date": "2026-10-30", "start": "17:00", "end": "19:00", "title": "Urologia", "loc": "LAB SIMULAÇÃO", "prof": "Eder, Maciel, Paulo e Mateus", "grupo": "C", "type": "estagio"}, {"date": "2026-11-03", "start": "08:00", "end": "10:00", "title": "Oftalmologia", "loc": "HOC", "prof": "Camila", "grupo": "C1", "type": "estagio"}, {"date": "2026-11-04", "start": "10:00", "end": "13:00", "title": "Urologia", "loc": "STELLA MARIS", "prof": "Eder", "grupo": "C1", "type": "estagio"}, {"date": "2026-11-16", "start": "10:00", "end": "12:30", "title": "Clínica Cirúrgica III (Téc. Cirúrgica)", "loc": "LAB. TEC. CIRURGIA", "prof": "Douglas, Vinicius e Giselle", "grupo": "C", "type": "fixo"}, {"date": "2026-11-29", "start": "07:00", "end": "09:30", "title": "Otorrinolaringologia", "loc": "STELLA MARIS", "prof": "Pedro e Carolina", "grupo": "C1", "type": "estagio"}]};
  const WEEKDAYS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  function isoLocal(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function blocksFor(date){
    const iso = isoLocal(date);
    const wd = date.getDay(); // 0=Sun..6=Sat
    const fixedKey = String((wd+6)%7); // convert to 0=Mon..6=Sun matching python weekday()
    let items = [];
    const fx = DATA.fixed[fixedKey];
    if (fx){
      fx.forEach(([start,end,title]) => {
        items.push({sort:start, html:`
          <div class="block fixo">
            <div class="block-time">${start}–${end}</div>
            <div class="block-title">${title}</div>
            <div class="block-loc">Sala 7</div>
          </div>`});
      });
    }
    DATA.estagios.filter(e => e.date === iso).forEach(e => {
      const isWeekend = (wd===0||wd===6);
      const cls = isWeekend ? 'sat' : (e.type === 'fixo' ? 'fixo' : 'estagio');
      const tagClass = isWeekend ? 'sat' : (e.type === 'fixo' ? '' : ('g-' + e.grupo.toLowerCase().replace('.', '')));
      const tagLabel = isWeekend ? 'Reposição' : (e.type === 'fixo' ? 'Prática rotativa' : 'Estágio');
      items.push({sort:e.start, html:`
        <div class="block ${cls}">
          <div class="block-time">${e.start}–${e.end}</div>
          <div class="block-title">${e.title}</div>
          <div class="block-loc">${e.loc}</div>
          <span class="block-tag ${tagClass}">${tagLabel} · ${e.grupo}</span>
        </div>`});
    });
    items.sort((a,b) => a.sort.localeCompare(b.sort));
    return items.map(i => i.html).join('');
  }

  function renderDayCard(date, label, isToday){
    const wd = WEEKDAYS[date.getDay()];
    const dstr = `${String(date.getDate()).padStart(2,'0')} ${MONTHS[date.getMonth()]}`;
    const blocksHtml = blocksFor(date);
    const body = blocksHtml || '<div class="empty">Sem aulas nem estágios</div>';
    return `
      <div class="day-card ${isToday ? 'today' : ''}">
        <div class="day-head">
          <div>
            <div class="day-label">${label}</div>
            <div class="day-title">${wd}</div>
          </div>
          <div class="day-date">${dstr}</div>
        </div>
        <div class="blocks">${body}</div>
      </div>`;
  }

  function render(){
    const today = new Date();
    today.setHours(0,0,0,0);
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate()+1);

    document.getElementById('cols').innerHTML =
      renderDayCard(today, 'Hoje', true) +
      renderDayCard(tomorrow, 'Amanhã', false);

    document.getElementById('clock').textContent =
      today.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
  }

  render();

  // re-render automatically after midnight without needing a page reload
  let lastDay = new Date().getDate();
  setInterval(() => {
    const d = new Date().getDate();
    if (d !== lastDay){
      lastDay = d;
      render();
    }
  }, 60 * 1000);
</script>

</body>
</html>
