<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#00000000">
<title>Cronograma — Hoje &amp; Amanhã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#151109;
    --card:rgba(29,24,16,0.55);
    --line:#4A3B24;
    --line-soft:#2C2416;
    --ink:#E9DFC4;
    --ink-soft:#B7A97F;
    --ink-faint:#7C7154;
    --gold:#B8965A;
    --fixed:#6E85A6;
    --fixed-tint:rgba(110,133,166,0.09);
    --estagio:#6E8F5C;
    --estagio-tint:rgba(110,143,92,0.10);
    --sat:#96688A;
    --sat-tint:rgba(150,104,138,0.10);
    --gc:#B08050;
    --gc1:#6A9AA8;
    --gc12:#C0A050;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent !important;}
  body{
    background:transparent !important;
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    padding:14px 16px;
    min-height:100vh;
  }
  .wrap{max-width:720px; margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:10px;
    padding-bottom:8px;
    position:relative;
  }
  .brand{
    font-family:'Cormorant Garamond', serif;
    font-size:12px; letter-spacing:0.28em; text-transform:uppercase;
    color:var(--gold); font-weight:600;
  }
  .clock{
    display:block; margin-top:4px;
    font-family:'Source Serif 4', serif; font-style:italic;
    font-size:12px; color:var(--ink-faint);
  }
  .rule{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:6px; color:var(--line);
  }
  .rule::before, .rule::after{
    content:""; flex:1; height:1px; background:var(--line); max-width:200px;
  }
  .rule span{ font-size:9px; color:var(--gold); }

  .cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:460px){
    .cols{grid-template-columns:1fr;}
  }

  .day-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:11px 12px;
    display:flex;
    flex-direction:column;
    gap:7px;
    min-height:0;
    position:relative;
  }
  .day-card::before{
    content:"";
    position:absolute; inset:3px;
    border:1px solid var(--line-soft);
    pointer-events:none;
  }
  .day-card.today{ border-color:var(--gold); }
  .day-card.today::before{ border-color:rgba(184,150,90,0.25); }

  .day-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .day-label{
    font-family:'Cormorant Garamond', serif; font-size:11px; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  .day-card.today .day-label{ color:var(--gold); }
  .day-title{
    font-family:'Source Serif 4', serif; font-weight:700; font-style:italic;
    font-size:16px; line-height:1.1; margin-top:0px;
  }
  .day-date{
    font-family:'Cormorant Garamond', serif; font-size:13px; color:var(--ink-soft); font-style:italic;
  }

  .blocks{ display:flex; flex-direction:column; gap:6px; }

  .block{
    border-left:2px solid var(--fixed);
    background:var(--fixed-tint);
    padding:5px 9px;
  }
  .block.estagio{ border-left-color:var(--estagio); background:var(--estagio-tint); }
  .block.fixo{ border-left-color:var(--fixed); background:var(--fixed-tint); }
  .block.sat{ border-left-color:var(--sat); background:var(--sat-tint); }
  .block.prova{ border-left-color:#C8574A; background:rgba(200,87,74,0.12); }
  .block.prova .block-title{ color:#E08A7E; }

  .block-time{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:11.5px;
    color:var(--ink-soft); margin-bottom:0px; letter-spacing:0.02em;
  }
  .block-title{ font-size:13px; font-weight:600; line-height:1.25; color:var(--ink); }
  .block-loc{ font-size:11px; color:var(--ink-soft); margin-top:0px; font-style:italic; }
  .block-tag{
    display:inline-block; font-family:'Cormorant Garamond', serif; font-size:9.5px;
    letter-spacing:0.12em; text-transform:uppercase; margin-top:2px; font-weight:600;
    color:var(--ink-faint);
  }
  .block-tag.g-c, .block-tag.g-c1, .block-tag.g-c12, .block-tag.sat{ color:var(--ink-faint); }
  .block-tag::before{ content:"— "; }

  .empty{
    font-size:13px; color:var(--ink-faint); font-style:italic; padding:6px 2px;
    font-family:'Source Serif 4', serif;
  }

  footer{
    margin-top:10px; text-align:center;
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:10.5px;
    color:var(--ink-faint); letter-spacing:0.03em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Sétimo Período · Medicina</span>
    <span class="clock" id="clock"></span>
    <div class="rule"><span>❧</span></div>
  </header>

  <div class="cols" id="cols"></div>

  <footer>Atualizado automaticamente à meia-noite</footer>
</div>

<script>
  let DATA = null;
  const CHAVE = ["", "segunda","terca","quarta","quinta","sexta",""];
  function adaptar(d){
    const fixed = {};
    CHAVE.forEach((k, wd) => { if (k) fixed[String((wd+6)%7)] = d.aulas_fixas.dias[k] || []; });
    return {
      periodo: d.periodo,
      fixed,
      estagios: d.estagios.map(e => ({ date:e.data, start:e.inicio, end:e.fim, title:e.disciplina, loc:e.local, prof:e.professor, grupo:e.grupo, type: e.tipo === "pratica" ? "fixo" : "estagio" })),
      provas: d.provas
    };
  }
  const WEEKDAYS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  function isoLocal(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function blocksFor(date){
    const iso = isoLocal(date);
    const wd = date.getDay(); // 0=Sun..6=Sat
    const fixedKey = String((wd+6)%7); // convert to 0=Mon..6=Sun matching python weekday()
    let items = [];
    const noPeriodo = iso >= DATA.periodo.inicio && iso <= DATA.periodo.fim;
    const fx = noPeriodo ? DATA.fixed[fixedKey] : null;
    if (fx){
      fx.forEach(([start,end,title]) => {
        items.push({sort:start, html:`
          <div class="block fixo">
            <div class="block-time">${start}–${end}</div>
            <div class="block-title">${title}</div>
            <div class="block-loc">Sala 7</div>
          </div>`});
      });
    }
    DATA.estagios.filter(e => e.date === iso).forEach(e => {
      const isWeekend = (wd===0||wd===6);
      const cls = isWeekend ? 'sat' : (e.type === 'fixo' ? 'fixo' : 'estagio');
      const tagClass = isWeekend ? 'sat' : (e.type === 'fixo' ? '' : ('g-' + e.grupo.toLowerCase().replace('.', '')));
      const tagLabel = isWeekend ? 'Reposição' : (e.type === 'fixo' ? 'Prática rotativa' : 'Estágio');
      items.push({sort:e.start, html:`
        <div class="block ${cls}">
          <div class="block-time">${e.start}–${e.end}</div>
          <div class="block-title">${e.title}</div>
          <div class="block-loc">${e.loc}</div>
          <span class="block-tag ${tagClass}">${tagLabel} · ${e.grupo}</span>
        </div>`});
    });
    DATA.provas.filter(p => p.data === iso).forEach(p => {
      items.push({sort:'00:00', html:`
        <div class="block prova">
          <div class="block-title">⚠ ${p.titulo}</div>
          <div class="block-loc">Avaliação</div>
        </div>`});
    });
    items.sort((a,b) => a.sort.localeCompare(b.sort));
    return items.map(i => i.html).join('');
  }

  function renderDayCard(date, label, isToday){
    const wd = WEEKDAYS[date.getDay()];
    const dstr = `${String(date.getDate()).padStart(2,'0')} ${MONTHS[date.getMonth()]}`;
    const blocksHtml = blocksFor(date);
    const body = blocksHtml || '<div class="empty">Sem aulas nem estágios</div>';
    return `
      <div class="day-card ${isToday ? 'today' : ''}">
        <div class="day-head">
          <div>
            <div class="day-label">${label}</div>
            <div class="day-title">${wd}</div>
          </div>
          <div class="day-date">${dstr}</div>
        </div>
        <div class="blocks">${body}</div>
      </div>`;
  }

  function render(){
    const today = new Date();
    today.setHours(0,0,0,0);
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate()+1);

    document.getElementById('cols').innerHTML =
      renderDayCard(today, 'Hoje', true) +
      renderDayCard(tomorrow, 'Amanhã', false);

    document.getElementById('clock').textContent =
      today.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
  }

  fetch('../dados.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { DATA = adaptar(d); render(); })
    .catch(() => { document.getElementById('cols').innerHTML = '<div class="empty">Não foi possível carregar dados.json.</div>'; });

  // re-render automatically after midnight without needing a page reload
  let lastDay = new Date().getDate();
  setInterval(() => {
    const d = new Date().getDate();
    if (d !== lastDay && DATA){
      lastDay = d;
      render();
    }
  }, 60 * 1000);
</script>

</body>
</html>
